# CI minima, e de proposito: espelha o perfil `mission` de .agentic/gates.yaml (verify + e2e)
# e prova que o produto compila — CLI, servidor, dashboard e extensao VS Code.
#
# Nomes dos checks sao estaveis (`verify`, `product-build`, `e2e`, `browser`) para que a
# protecao de branch possa exigi-los sem renomear nada. Nenhum job publica: release e VSIX
# continuam sendo ato humano explicito (ver CONTRIBUTING.md).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run verify

  product-build:
    name: product-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: A CLI carrega a partir do build
        run: node apps/cli/bin/agentic.mjs --version
      - name: Extensao VS Code compila
        run: npm run vscode:build
      - name: Extensao VS Code empacota (o VSIX fica no runner e e descartado)
        working-directory: extensions/vscode
        run: npx vsce package --no-dependencies --out "$RUNNER_TEMP/desenvolvimento-agentico-vscode.vsix"

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run test:e2e

  browser:
    name: browser
    # Chromium de verdade contra servidor, banco e orquestrador reais. So na linha principal
    # (e sob demanda): custa o runtime do navegador e nao entra no perfil `mission`.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Trace e screenshot das falhas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: /tmp/agentic-browser-*/test-results
          if-no-files-found: ignore
          retention-days: 7
